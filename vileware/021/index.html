<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VILE KART — Course Select</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050302;overflow:hidden}#pick{position:fixed;inset:0;z-index:2;background:#050302;display:flex;align-items:center;justify-content:center}.art{position:relative;width:min(100vw,calc(100vh * 1.5));aspect-ratio:3/2;background:url('assets/course_select/course-select-warroom.jpg') center/100% 100% no-repeat;filter:drop-shadow(0 0 35px #000)}.hotspot{position:absolute;z-index:3;border:0;outline:0;background:transparent;cursor:pointer;padding:0}.hotspot:after{content:'';position:absolute;inset:0;border:2px solid transparent;box-shadow:inset 0 0 0 transparent;transition:border-color .12s,box-shadow .12s}.hotspot:hover:after,.hotspot:focus-visible:after{border-color:rgba(238,190,91,.58);box-shadow:inset 0 0 22px rgba(238,190,91,.13),0 0 12px rgba(238,190,91,.18)}.hotspot.locked{cursor:not-allowed;background:rgba(0,0,0,.48)}.hotspot.locked:after{border-color:rgba(80,70,60,.45)}.hotspot.won:after{border-color:rgba(238,190,91,.72);box-shadow:inset 0 0 26px rgba(238,190,91,.16)}.hotspot.new:after{border-color:#f0ce79;box-shadow:inset 0 0 32px rgba(240,206,121,.25),0 0 22px rgba(240,206,121,.42);animation:newPulse 1.1s ease-in-out infinite}.lockmark{position:absolute;inset:0;display:grid;place-items:center;color:#c8aa70;font:700 clamp(12px,1.25vw,20px) Georgia,serif;letter-spacing:.12em;text-shadow:2px 2px 3px #000;background:rgba(4,3,2,.45)}.wonmark,.newmark{position:absolute;right:4%;top:5%;color:#f0ce79;font:700 clamp(12px,1.3vw,21px) Georgia,serif;text-shadow:2px 2px 3px #000}.newmark{left:4%;right:auto;color:#fff0ad}.progress{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);z-index:5;color:#e8c978;background:rgba(5,3,2,.82);border:1px solid rgba(232,201,120,.42);padding:.5em 1em;font:700 clamp(11px,1.05vw,16px) Georgia,serif;letter-spacing:.08em;text-shadow:2px 2px #000;white-space:nowrap}.reset{position:absolute;right:2.2%;bottom:2.2%;z-index:6;color:#bda66d;background:rgba(5,3,2,.86);border:1px solid rgba(189,166,109,.42);padding:.55em .8em;font:700 clamp(9px,.82vw,13px) Georgia,serif;letter-spacing:.08em;cursor:pointer}.reset:hover,.reset:focus-visible{color:#f0ce79;border-color:#e8c978;box-shadow:0 0 12px rgba(232,201,120,.18)}.difficulty{position:absolute;left:2.2%;bottom:2.2%;z-index:7;display:flex;gap:4px;background:rgba(5,3,2,.86);border:1px solid rgba(189,166,109,.42);padding:4px}.difficulty button{border:1px solid transparent;background:transparent;color:#9f8b60;padding:.45em .55em;font:700 clamp(8px,.72vw,11px) Georgia,serif;letter-spacing:.05em;cursor:pointer}.difficulty button:hover,.difficulty button:focus-visible{color:#f0ce79;outline:none}.difficulty button.active{color:#fff0ad;border-color:#b88b3d;background:rgba(118,65,15,.28);box-shadow:inset 0 0 10px rgba(232,201,120,.12)}.c1{left:12.2%;top:28.4%;width:25.5%;height:27.2%}.c2{left:38.4%;top:28.4%;width:25.5%;height:27.2%}.c3{left:64.5%;top:28.4%;width:25.5%;height:27.2%}.c4{left:12.2%;top:57.4%;width:25.5%;height:24.2%}.c5{left:38.4%;top:57.4%;width:25.5%;height:24.2%}.c6{left:64.5%;top:57.4%;width:25.5%;height:24.2%}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#090909;display:none}.reward{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(104,22,7,.45),rgba(3,2,1,.96) 62%),url('assets/blackwater/scene_01.jpg') center/cover no-repeat;color:#f0ce79;text-align:center}.reward:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0,rgba(0,0,0,.1) 1px,transparent 2px,transparent 4px);pointer-events:none}.rewardCard{position:relative;width:min(760px,88vw);min-height:430px;padding:32px 42px;border:2px solid #b88b3d;outline:1px solid #493015;outline-offset:-9px;background:linear-gradient(rgba(10,5,2,.83),rgba(2,2,1,.93));box-shadow:0 0 60px #000,inset 0 0 50px rgba(128,54,10,.22)}.rewardKicker{font:700 clamp(13px,1.4vw,18px) Georgia,serif;letter-spacing:.32em;color:#b99b60}.rewardTitle{margin:.15em 0 .08em;font:900 clamp(38px,6vw,76px) Georgia,serif;letter-spacing:.04em;color:#f4d77e;text-shadow:0 3px #3b1608,0 0 22px rgba(239,154,45,.35)}.rewardCourse{font:700 clamp(18px,2.3vw,30px) Georgia,serif;color:#fff0b0;letter-spacing:.08em}.unlockLine{margin:22px auto 8px;padding:10px 18px;border-top:1px solid #6d5126;border-bottom:1px solid #6d5126;font:700 clamp(14px,1.6vw,21px) Georgia,serif;letter-spacing:.14em;color:#d8bc78}.racerReveal{display:none;align-items:center;justify-content:center;gap:24px;margin:12px auto 2px}.racerReveal img{width:min(300px,40vw);height:150px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 8px 12px #000)}.racerText{text-align:left}.racerText strong{display:block;font:900 clamp(23px,3vw,38px) Georgia,serif;color:#fff0ad;letter-spacing:.05em}.racerText span{font:700 14px Georgia,serif;letter-spacing:.16em;color:#b99b60}.rewardButton{margin-top:24px;padding:12px 24px;color:#f0ce79;background:#140b05;border:1px solid #b88b3d;font:700 15px Georgia,serif;letter-spacing:.14em;cursor:pointer}.rewardButton:hover,.rewardButton:focus{background:#d2ad5b;color:#160a03;outline:none}.embers{position:absolute;inset:0;overflow:hidden;pointer-events:none}.embers i{position:absolute;bottom:-10px;width:3px;height:3px;background:#e9a33a;box-shadow:0 0 8px #e54b13;animation:ember 4s linear infinite}.embers i:nth-child(2){left:18%;animation-delay:-1.4s}.embers i:nth-child(3){left:34%;animation-delay:-2.6s}.embers i:nth-child(4){left:62%;animation-delay:-.7s}.embers i:nth-child(5){left:79%;animation-delay:-3.1s}.embers i:nth-child(6){left:92%;animation-delay:-1.9s}@keyframes ember{from{transform:translateY(0) translateX(0);opacity:0}15%{opacity:1}to{transform:translateY(-90vh) translateX(35px);opacity:0}}@keyframes newPulse{50%{box-shadow:inset 0 0 42px rgba(240,206,121,.35),0 0 32px rgba(240,206,121,.65)}}@media(max-aspect-ratio:3/2){.art{width:100vw;height:auto}}@media(min-aspect-ratio:3/2){.art{height:100vh;width:auto}}@media(max-width:650px){.rewardCard{padding:24px 20px;min-height:0}.racerReveal{flex-direction:column}.racerText{text-align:center}}</style></head><body><div id="pick"><div class="art" role="group" aria-label="VILE KART Course Select"><button class="hotspot c1" data-course="1" aria-label="Course 1 Castle Blackwater"></button><button class="hotspot c2" data-course="2" aria-label="Course 2 The Wrong Forest"></button><button class="hotspot c3" data-course="3" aria-label="Course 3 Graveyard Shift"></button><button class="hotspot c4" data-course="4" aria-label="Course 4 The Drunken Dragon"></button><button class="hotspot c5" data-course="5" aria-label="Course 5 Dragon's Back"></button><button class="hotspot c6" data-course="6" aria-label="Course 6 The Plague Town"></button><div class="difficulty" id="difficulty"><button data-diff="normal">NORMAL</button><button data-diff="vile">VILE</button><button data-diff="absolutely-vile">ABSOLUTELY VILE</button></div><div class="progress" id="progress"></div><button class="reset" id="resetCampaign" type="button">NEW CAMPAIGN</button></div></div><iframe id="vk" allow="autoplay"></iframe><div class="reward" id="reward"><div class="embers"><i style="left:6%"></i><i></i><i></i><i></i><i></i><i></i></div><div class="rewardCard"><div class="rewardKicker">VILE KART // CAMPAIGN</div><div class="rewardTitle">COURSE CONQUERED</div><div class="rewardCourse" id="rewardCourse"></div><div class="unlockLine" id="unlockLine"></div><div class="racerReveal" id="racerReveal"><img id="racerArt" alt=""><div class="racerText"><span>NEW BASTARD UNLOCKED</span><strong id="racerName"></strong></div></div><button class="rewardButton" id="rewardContinue">RETURN TO THE WAR ROOM</button></div></div><script>const pick=document.getElementById('pick'),f=document.getElementById('vk'),progressEl=document.getElementById('progress'),resetCampaign=document.getElementById('resetCampaign'),difficultyEl=document.getElementById('difficulty'),reward=document.getElementById('reward'),rewardCourse=document.getElementById('rewardCourse'),unlockLine=document.getElementById('unlockLine'),racerReveal=document.getElementById('racerReveal'),racerArt=document.getElementById('racerArt'),racerName=document.getElementById('racerName'),rewardContinue=document.getElementById('rewardContinue');const KEY='vileKartProgressV1',DIFF_KEY='vileKartDifficultyV1',RACER_MILESTONES=[2,3,4,6],COURSE_NAMES=['','CASTLE BLACKWATER','THE WRONG FOREST','GRAVEYARD SHIFT','THE DRUNKEN DRAGON','DRAGON’S BACK','THE PLAGUE TOWN'],RACERS={2:{name:'MORANA',art:'assets/racers/morana_side.png'},3:{name:'THE HOLLOWMAN',art:'assets/racers/hollowman_side.png'},4:{name:'ZRAK',art:'assets/racers/zrak_side.png'},6:{name:'MR. PEPPERWOOD',art:'assets/racers/pepperwood_side.png'}};let course=1,newCourseMark=0,difficulty=localStorage.getItem(DIFF_KEY)||'normal';if(!['normal','vile','absolutely-vile'].includes(difficulty))difficulty='normal';function racerUnlockCount(p){return RACER_MILESTONES.filter(n=>p.won.includes(n)).length}function loadProgress(){try{const p=JSON.parse(localStorage.getItem(KEY)||'{}');const won=Array.isArray(p.won)?p.won.filter(n=>n>=1&&n<=6):[];return{won,racers:racerUnlockCount({won})}}catch(e){return{won:[],racers:0}}}function saveProgress(p){p.racers=racerUnlockCount(p);localStorage.setItem(KEY,JSON.stringify(p))}function unlocked(n,p=loadProgress()){return n===1||p.won.includes(n-1)}function renderDifficulty(){difficultyEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.diff===difficulty))}function renderProgress(){const p=loadProgress();document.querySelectorAll('.hotspot[data-course]').forEach(b=>{const n=Number(b.dataset.course),isOpen=unlocked(n,p),isWon=p.won.includes(n),isNew=n===newCourseMark;b.classList.toggle('locked',!isOpen);b.classList.toggle('won',isWon);b.classList.toggle('new',isNew);b.disabled=!isOpen;b.querySelectorAll('.lockmark,.wonmark,.newmark').forEach(x=>x.remove());if(!isOpen){const m=document.createElement('span');m.className='lockmark';m.textContent=`LOCKED • WIN COURSE ${n-1}`;b.appendChild(m)}else if(isWon){const m=document.createElement('span');m.className='wonmark';m.textContent='★ WON';b.appendChild(m)}if(isNew){const m=document.createElement('span');m.className='newmark';m.textContent='★ NEW';b.appendChild(m)}});progressEl.textContent=`CAMPAIGN ${p.won.length}/6 • RACERS ${8+p.racers}/12`;renderDifficulty()}function launch(n){if(!unlocked(n))return;newCourseMark=0;course=n;pick.style.display='none';f.style.display='block';f.src='runtime.html'}function showSelect(){reward.style.display='none';f.style.display='none';f.removeAttribute('src');pick.style.display='flex';renderProgress()}function showVictory(firstWin){f.style.display='none';f.removeAttribute('src');pick.style.display='none';rewardCourse.textContent=COURSE_NAMES[course]||`COURSE ${course}`;const racer=firstWin?RACERS[course]:null;newCourseMark=firstWin&&course<6?course+1:0;if(firstWin&&course<6)unlockLine.textContent=`NEXT COURSE UNLOCKED // ${COURSE_NAMES[course+1]}`;else if(firstWin&&course===6)unlockLine.textContent='CAMPAIGN CONQUERED // ALL SIX COURSES FALL';else unlockLine.textContent='VICTORY RECORDED // THIS COURSE WAS ALREADY YOURS';if(racer){racerName.textContent=racer.name;racerArt.src=racer.art;racerArt.alt=racer.name;racerReveal.style.display='flex'}else{racerReveal.style.display='none';racerArt.removeAttribute('src')}reward.style.display='grid';rewardContinue.focus()}function newCampaign(){const p=loadProgress();if(!p.won.length)return;if(!confirm('START A NEW CAMPAIGN?\n\nThis erases VILE KART course wins and racer unlocks.'))return;localStorage.removeItem(KEY);course=1;newCourseMark=0;showSelect()}resetCampaign.addEventListener('click',newCampaign);difficultyEl.addEventListener('click',e=>{const b=e.target.closest('button[data-diff]');if(!b)return;difficulty=b.dataset.diff;localStorage.setItem(DIFF_KEY,difficulty);renderDifficulty()});rewardContinue.addEventListener('click',showSelect);reward.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){showSelect();e.preventDefault()}});f.addEventListener('load',()=>{if(!f.src)return;const boot=()=>{try{const p=loadProgress();f.contentWindow.VK_COURSE_NUMBER=course;f.contentWindow.VK_UNLOCKED_RACERS=p.racers;f.contentWindow.VK_DIFFICULTY=difficulty;f.contentWindow.VK_REPORT_RESULT=result=>{if(result&&result.won){const p=loadProgress(),firstWin=!p.won.includes(course);if(firstWin){p.won.push(course);p.won.sort((a,b)=>a-b);saveProgress(p)}showVictory(firstWin)}else showSelect()};f.contentWindow.VK_RETURN_TO_COURSES=showSelect;const d=f.contentDocument,pb=d.createElement('script');pb.src='progression-runtime.js';pb.onload=()=>{const r=d.createElement('script');r.src='shiniest-roster-ui.js';r.onload=()=>f.contentWindow.focus();d.body.appendChild(r)};d.body.appendChild(pb)}catch(e){f.contentWindow.focus()}};if(course>=2&&course<=6){const d=f.contentDocument,s=d.createElement('script');s.src=`course${course}-runtime.js`;s.onload=boot;d.body.appendChild(s)}else boot()});document.querySelectorAll('.hotspot[data-course]').forEach(b=>b.onclick=()=>launch(Number(b.dataset.course)));window.addEventListener('keydown',e=>{if(reward.style.display==='grid')return;if(pick.style.display!=='none'&&['1','2','3','4','5','6'].includes(e.key))launch(Number(e.key))});renderProgress();</script><script src="shinier-cup-ui.js" data-vk-shinier-cup="1"></script></body></html>
