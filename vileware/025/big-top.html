<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE BIG TOP</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050302}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#090909}#done{position:fixed;z-index:20;inset:0;display:none;place-items:center;background:rgba(3,1,2,.88);color:#ffe08a;text-align:center;font-family:Georgia,serif}#card{border:2px solid #d2a64d;background:#100507;padding:36px 48px;box-shadow:0 0 70px #000}button{margin-top:20px;padding:12px 22px;border:1px solid #bd8e3b;background:#16090b;color:#f3d477;font-weight:700;cursor:pointer}</style></head><body><iframe id="race" src="runtime.html?event=big-top" allow="autoplay"></iframe><div id="done"><div id="card"><h1 id="result">THE BIG TOP</h1><div id="detail"></div><button id="back">RETURN TO WAR ROOM</button></div></div><script>(()=>{'use strict';const f=document.getElementById('race'),done=document.getElementById('done'),result=document.getElementById('result'),detail=document.getElementById('detail');f.addEventListener('load',()=>setTimeout(()=>{try{const w=f.contentWindow;w.VK_COURSE_NUMBER=12;w.VK_EVENT_MODE='BIG_TOP';w.VK_EVENT_LAPS=10;const s=w.document.createElement('script');s.src='event-big-top-runtime.js';w.document.body.appendChild(s);const timer=setInterval(()=>{try{if(!w.finished)return;clearInterval(timer);const won=w.player&&w.player.pos===1;if(won)localStorage.setItem('vileKartEventBigTopV1','won');result.textContent=won?'THE BIG TOP CONQUERED':'THE CIRCUS WINS';detail.textContent=won?'THE BASTARDS ARE BACK IN THEIR BOX.':'TRY AGAIN, YOU COWARD.';done.style.display='grid'}catch(e){}},250)}catch(e){console.error(e)}},100));document.getElementById('back').onclick=()=>parent.postMessage('VK_BIG_TOP_RETURN','*')})();</script></body></html>
