<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VILE KART</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050302}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050302}#event{position:fixed;z-index:50;left:50%;top:18px;transform:translateX(-50%);display:none;border:1px solid #c99b42;background:#100804;color:#ffe59a;padding:.65em 1.35em;font:900 16px Georgia,serif;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 18px rgba(226,166,57,.25)}#event:hover{background:#d3a64c;color:#140903}</style></head><body><iframe id="game" src="course-select.html" allow="autoplay"></iframe><button id="event" type="button">EVENTS // THE BIG TOP</button><script>(()=>{'use strict';const KEY='vileKartProgressV1',f=document.getElementById('game'),b=document.getElementById('event');function done(){try{const p=JSON.parse(localStorage.getItem(KEY)||'{}');return Array.isArray(p.won)&&[1,2,3,4,5,6].every(n=>p.won.includes(n))}catch{return false}}function render(){b.style.display=done()?'block':'none'}b.onclick=()=>{b.style.display='none';f.src='big-top.html'};addEventListener('message',e=>{if(e.data==='VK_BIG_TOP_RETURN'){f.src='course-select.html';setTimeout(render,250)}});setInterval(render,500);render()})();</script></body></html>
