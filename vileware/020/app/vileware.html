<!doctype html><style>html,body{margin:0;background:#020604;color:#91c397;font:16px Consolas,monospace}*{scrollbar-width:thin;scrollbar-color:#456b4b #020604}*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:#020604}*::-webkit-scrollbar-thumb{background:#456b4b;border:2px solid #020604;box-shadow:inset 0 0 4px #72a77a}*::-webkit-scrollbar-thumb:hover{background:#72a77a}main{max-width:980px;margin:25px auto;padding:26px;border:1px solid #456b4b;background:#030a05}h1{color:#b7ddb9}.line{padding:9px 0;border-bottom:1px solid #17301d}.ok{color:#c9edcc}.bad{color:#e6a0a0}.warn{color:#d8c58c}button{margin:14px 8px 0 0;padding:10px 13px;border:1px solid #456b4b;color:#b7ddb9;background:#071109;font:inherit}pre{white-space:pre-wrap;max-height:520px;overflow:auto;border:1px solid #17301d;padding:13px}</style><main><h1>VILEWARE™ // SELECTOR 015</h1><div id=b class=line>READY</div><pre id=o>015 uses direct repo paths. No runtime.html injection.</pre><button id=s>[ SCAN + LOCATE RAG-TAG FILES ]</button><button id=p>[ AUTHORISE 015 ]</button><button id=k>[ LAUNCH KART ]</button><button id=h>[ RETURN ]</button></main><script>const a=masterBastardBridge;function fmt(r){return r.objects.map(x=>x.state+' // '+x.path).join('\n')+'\n\nRAG-TAG MIRROR FILES:\n'+r.rag.map(x=>(x.present?'PRESENT ':'MISSING ')+x.name).join('\n')+'\n\nLOCAL REPO ASSET DIRS FOUND:\n'+(r.imported.repoAssetDirs.join('\n')||'(none)')+'\n\nIMPORTED THIS SCAN: '+r.imported.found.length+' / 10'+(r.imported.missing.length?'\nMISSING SOURCE:\n'+r.imported.missing.join('\n'):'')}s.onclick=async()=>{try{let r=await a.scan();b.textContent=r.imported.missing.length?'RAG-TAG SOURCE INCOMPLETE':'ALL 10 RAG-TAG FILES LOCATED';b.className=r.imported.missing.length?'line warn':'line ok';o.textContent=fmt(r)}catch(e){b.textContent='SCAN FAILED';b.className='line bad';o.textContent=e.stack||e.message}};p.onclick=async()=>{try{b.textContent='PATCHING 015...';let r=await a.patch();b.textContent='015 COMPLETE // VERIFIED';b.className='line ok';o.textContent=fmt(r)+'\n\nLaunch Kart and inspect selector.'}catch(e){b.textContent='015 ABORTED SAFELY';b.className='line bad';o.textContent=e.stack||e.message}};k.onclick=()=>a.launch();h.onclick=()=>a.home();</script>
